<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SmartRecruiters fixture</title></head>
<body>
  <form class="jobapp-form" id="st-jobApplicationForm">
    <div class="form-group">
      <label for="sr-first">First name *</label>
      <input id="sr-first" name="firstName" type="text" />
    </div>
    <div class="form-group">
      <label for="sr-last">Last name *</label>
      <input id="sr-last" name="lastName" type="text" />
    </div>
    <div class="form-group">
      <label for="sr-email">Email *</label>
      <input id="sr-email" name="email" type="email" />
    </div>
    <div class="form-group">
      <label for="sr-phone">Phone *</label>
      <input id="sr-phone" name="phone" type="tel" />
    </div>
    <div class="form-group">
      <label for="sr-city">City *</label>
      <input id="sr-city" name="city" type="text" />
    </div>
    <div class="form-group">
      <label for="sr-country">Country *</label>
      <select id="sr-country" name="country">
        <option value="">Select</option>
        <option value="US">United States</option>
        <option value="DE">Germany</option>
      </select>
    </div>
    <div class="form-group">
      <label for="sr-li">LinkedIn profile</label>
      <input id="sr-li" name="linkedin" type="url" />
    </div>
    <div class="form-group">
      <label for="sr-auth">Are you eligible to work in this country? *</label>
      <select id="sr-auth" name="workAuth">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
