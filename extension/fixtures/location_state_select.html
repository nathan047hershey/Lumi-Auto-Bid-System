<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Location state select fixture</title>
<style>
  body { font-family: system-ui; max-width: 720px; margin: 24px auto; }
  .field { margin: 18px 0; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  select, input { width: 100%; max-width: 480px; padding: 8px; }
  .select-shell .select__control {
    border: 1px solid #ccc; border-radius: 6px; padding: 10px;
    display: flex; min-height: 40px;
  }
  .select__single-value { color: #111; }
  .select__input { border: 0; width: 2px; opacity: 0; }
</style>
</head>
<body>
<form id="application_form" data-provider="Greenhouse">
  <h1>Location / contractor required selects</h1>

  <div class="field">
    <label for="phone">Phone *</label>
    <input id="phone" name="phone" type="tel" required value="(937) 326-3137" />
  </div>

  <div class="field" id="field-location">
    <label for="location_state">
      Where are you located? (We are always expanding, but there is a small list of states we do not hire in,
      including Alabama, Alaska, Delaware, District of Columbia, Hawaii, Iowa, Louisiana, Mississippi,
      Nebraska, New Mexico, Rhode Island, South Dakota, West Virginia and Utah and while we love all parts
      of the world, we can only hire permanent US residents at this time.) *
    </label>
    <select id="location_state" name="location_state" required>
      <option value="">Select...</option>
      <option value="CA">California</option>
      <option value="NY">New York</option>
      <option value="OH">Ohio</option>
      <option value="TX">Texas</option>
      <option value="WA">Washington</option>
      <option value="AL">Alabama</option>
      <option value="UT">Utah</option>
    </select>
  </div>

  <div class="field" id="field-flexential">
    <label>
      Are you currently (or previously) working for Flexential as a contractor or contingent worker? *
    </label>
    <div class="select-shell">
      <div class="select__control">
        <div class="select__value-container select__value-container--has-value">
          <div class="select__single-value">No</div>
          <input class="select__input" id="flexential_select" role="combobox" value="" />
        </div>
      </div>
    </div>
  </div>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
