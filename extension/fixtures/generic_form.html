<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generic ATS fixture</title></head>
<body>
  <form id="careers-apply">
    <div>
      <label for="g-first">First Name *</label>
      <input id="g-first" name="first_name" type="text" />
    </div>
    <div>
      <label for="g-last">Last Name *</label>
      <input id="g-last" name="last_name" type="text" />
    </div>
    <div>
      <label for="g-email">Email *</label>
      <input id="g-email" name="email" type="email" />
    </div>
    <div>
      <label for="g-phone">Mobile phone *</label>
      <input id="g-phone" name="phone" type="tel" />
    </div>
    <div>
      <label for="g-city">City *</label>
      <input id="g-city" name="city" type="text" />
    </div>
    <div>
      <label for="g-sponsor">Do you require visa sponsorship? *</label>
      <select id="g-sponsor" name="sponsor">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
