# Render Blueprint
# Deploy full-stack app to Render

services:
  # Backend API (Node.js + Express + SQLite)
  - type: web
    name: lumi-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_API_KEY_2
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Frontend (React + Vite)
  - type: web
    name: lumi-client
    env: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    headers:
      - path: /**
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lumi-api
          envVarKey: RENDER_EXTERNAL_URL
        # Or use direct URL:
        # value: https://lumi-api.onrender.com
